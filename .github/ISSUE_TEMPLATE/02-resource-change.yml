name: Resource change
description: Suggest a better course, book, or reading for an existing module.
title: "[Resource]: "
labels: ["resource"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please skim the resource bar in
        [CONTRIBUTING.md](https://github.com/ken051352-max/heheh/blob/genspark_ai_developer/CONTRIBUTING.md#resource-bar).

        Default lectures must be **free**. Books may be free or paid: recommend
        them on their educational merits and label access clearly. Proposals should
        explain which outcome improves and whether an existing entry is replaced.
  - type: input
    id: module
    attributes:
      label: Which module?
      placeholder: "M9 — curriculum/3-classical-ml.md"
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Resource you are proposing
      description: Title and URL.
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: Access and cost
      options:
        - "Free lectures or legitimate free full-text book"
        - "Free lectures, optional paid certificate"
        - "Partial access or preview only"
        - "Paid book (purchase or library access)"
    validations:
      required: true
  - type: input
    id: replaces
    attributes:
      label: What should it replace?
      description: >
        Name the existing entry it displaces. If it is purely additive, write
        "additive" and explain why the module needs another alternative.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is it better?
      description: >
        Tie this to the module's stated outcome. "Clearer explanations" is weaker
        than "covers the outcome the current resource skips, namely X".
    validations:
      required: true
  - type: checkboxes
    id: pickone
    attributes:
      label: Canonical resource defaults
      description: >
        The Canonical resource defaults names the single default course per module and is what
        most readers actually follow.
      options:
        - label: This change should also update the Canonical resource defaults.
          required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
