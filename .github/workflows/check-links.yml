name: Check links and practice harness

on:
  push:
    paths:
      - "**/*.md"
      - "tools/**"
      - "curriculum/modules.json"
      - "resources/numpy-from-scratch/**"
      - "resources/local-labs/**"
      - "resources/agent-lab/**"
      - "resources/beginner-projects/**"
      - ".github/workflows/check-links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/**"
      - "curriculum/modules.json"
      - "resources/numpy-from-scratch/**"
      - "resources/local-labs/**"
      - "resources/agent-lab/**"
      - "resources/beginner-projects/**"
      - ".github/workflows/check-links.yml"
  schedule:
    - cron: "0 6 1 * *"   # monthly external-link freshness report
  workflow_dispatch:

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal markdown links and anchors (blocking)
        run: python tools/check_links.py
      - name: Validate curriculum prerequisites and generated guide tables (blocking)
        run: python tools/check_curriculum.py --check
      - name: Test curriculum integrity, link parsing and HTTP classification offline
        run: python -m unittest discover -s tools/tests -v
      - name: Test local agent contracts without a model or paid service
        run: python -m unittest discover -s resources/agent-lab/tests -v

  numpy-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r resources/numpy-from-scratch/requirements.txt -r resources/local-labs/requirements.txt -r resources/beginner-projects/requirements.txt
      - name: Validate the reference solutions against the regression suite
        working-directory: resources/numpy-from-scratch
        env:
          NPFS_IMPL: reference
        run: python -m pytest -q tests
      - name: Test causal identification and local event replay contracts
        run: python -m unittest discover -s resources/local-labs/tests -v
      - name: Test beginner calculator, offline weather and SQL references
        env:
          BEGINNER_IMPL: reference
        run: python -m pytest resources/beginner-projects/tests -q

  external-links:
    # Report-only: many sites return 403 to bots. Runs monthly or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HTTP-check external URLs
        run: python tools/check_links.py --external --report external-links-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: external-links-report
          path: external-links-report.md
