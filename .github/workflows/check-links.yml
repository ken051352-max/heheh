name: Check links and practice harness

on:
  push:
    paths:
      - "**/*.md"
      - "tools/check_links.py"
      - "resources/numpy-from-scratch/**"
      - ".github/workflows/check-links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/check_links.py"
      - "resources/numpy-from-scratch/**"
      - ".github/workflows/check-links.yml"
  schedule:
    - cron: "0 6 1 * *"   # monthly external-link freshness report
  workflow_dispatch:

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal markdown links and anchors (blocking)
        run: python tools/check_links.py

  numpy-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: pip install -r resources/numpy-from-scratch/requirements.txt
      - name: Prove the tests are correct against the reference solutions
        working-directory: resources/numpy-from-scratch
        env:
          NPFS_IMPL: reference
        run: python -m pytest -q tests

  external-links:
    # Report-only: many sites return 403 to bots. Runs monthly or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HTTP-check external URLs
        run: python tools/check_links.py --external --report external-links-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: external-links-report
          path: external-links-report.md
