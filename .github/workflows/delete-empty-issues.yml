name: Close empty issues
on:
  issues:
    types:
      - opened
jobs:
  label_issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    if: github.event.issue.body == null || github.event.issue.body == ''
    steps:
      - name: Create comment
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-comment'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hi @${{ github.event.issue.user.login }}. This issue has an empty description, so there is not enough information to investigate it. It will be closed; please reopen it with details or choose an issue form:

            https://github.com/${{ github.repository }}/issues/new/choose

            The forms cover broken links, resource suggestions, confusing instructions and curriculum proposals. Include the affected file, what you expected and what happened. For reading guidance, see START-HERE.md, FAQ.md and guides/how-to-read-a-module.md in this repository.
      - name: Close issue
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'close-issue'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
